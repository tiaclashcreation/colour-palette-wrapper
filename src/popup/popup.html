<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colour Season Helper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <p class="eyebrow">Colour Season Helper</p>
        <h1>Find Your Best Matches</h1>
      </header>

      <section class="card">
        <label for="seasonSelect">Your season</label>
        <select id="seasonSelect"></select>
      </section>

      <section class="card actions">
        <button id="scanButton">Scan first 100</button>
        <button id="clearButton" class="ghost">Clear</button>
      </section>

      <section class="card filter-modes">
        <h2>Filter mode</h2>
        <div class="mode-buttons">
          <button id="modeMatchButton" class="mode-button">Matches only</button>
          <button id="modeAllButton" class="mode-button">Show all</button>
        </div>
      </section>

      <p id="statusText" class="status">Ready</p>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
